name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Usun stare wydania 1.x
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep '^v1\.' || true); do
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y
          done

      - name: Wersja (0.1, 0.2, 0.3 ...)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep -E '^v0\.[0-9]+$' | sed 's/^v0\.//' | sort -n | tail -1)
          VERSION="0.$(( ${LAST:-0} + 1 ))"
          echo "Wersja: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "window.XYX_VERSION = '$VERSION';" > www/version.js

      - name: Strona WWW (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Capacitor
        run: |
          npm install
          npx cap add android
          cp android-config/google-services.json android/app/google-services.json
          D=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          cp android-config/MainActivity.java android-config/UpdaterPlugin.java "$D/"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          printf '\next {\n    rgcfaIncludeGoogle = true\n}\n' >> android/variables.gradle
          npx cap sync android

      - name: Klucz podpisu (keystore/xyxword.jks z repo)
        run: |
          cat >> android/app/build.gradle <<GRADLE

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "${VERSION}"
              }
              signingConfigs {
                  xyx {
                      storeFile file("${GITHUB_WORKSPACE}/keystore/xyxword.jks")
                      storePassword System.getenv("KS_PASS_GRADLE")
                      keyAlias "xyxword"
                      keyPassword System.getenv("KS_PASS_GRADLE")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.xyx
                      minifyEnabled false
                  }
              }
          }
          GRADLE
          echo "KS_PASS_GRADLE=arvv7JY9QkPyx7pOuIjs1GrC" >> $GITHUB_ENV

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../xyxword-${VERSION}.apk

      - name: Release na GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: XyxWord ${{ env.VERSION }}
          body: ${{ github.event.head_commit.message || 'Nowa wersja' }}
          files: xyxword-${{ env.VERSION }}.apk
          make_latest: true

  web:
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: dep
        uses: actions/deploy-pages@v4
