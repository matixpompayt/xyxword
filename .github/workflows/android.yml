name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Wersja
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "window.XYX_VERSION = '$VERSION';" > www/version.js

      - name: Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Klucz podpisu
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/xyx.jks"
          else
            echo "::warning::Brak sekretow KEYSTORE_BASE64/KEYSTORE_PASSWORD - tymczasowy klucz, aktualizacje nie zainstaluja sie na starej wersji"
            KS_PASS=tymczasowe123
            keytool -genkeypair -keystore "$RUNNER_TEMP/xyx.jks" -alias xyxword -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=XyxWord temp"
          fi
          cat >> android/app/build.gradle <<GRADLE

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "${VERSION}"
              }
              signingConfigs {
                  xyx {
                      storeFile file("${RUNNER_TEMP}/xyx.jks")
                      storePassword System.getenv("KS_PASS_GRADLE")
                      keyAlias "xyxword"
                      keyPassword System.getenv("KS_PASS_GRADLE")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.xyx
                      minifyEnabled false
                  }
              }
          }
          GRADLE
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS_GRADLE=$KS_PASS" >> $GITHUB_ENV

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../xyxword-${VERSION}.apk

      - name: Release na GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: XyxWord ${{ env.VERSION }}
          body: ${{ github.event.head_commit.message || 'Nowa wersja' }}
          files: xyxword-${{ env.VERSION }}.apk
          make_latest: true
