<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121418">
<title>XyxWord</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <div id="coName" class="co">Moja Firma</div>
    <div id="clock" class="clock">Dzień 1, 00:00</div>
  </div>
  <div class="cash">
    <div id="cash" class="cashv">$0</div>
    <div id="inc" class="incv">+$0/h</div>
  </div>
  <button class="gear" data-a="settings" aria-label="Ustawienia">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.9 4.6-.1-2.2 2-1.6-2-3.5-2.4.9a8 8 0 0 0-1.9-1.1L16 3h-4l-.4 2.6a8 8 0 0 0-1.9 1.1l-2.4-.9-2 3.5 2 1.6-.1 2.2-2 1.6 2 3.5 2.4-.9c.6.5 1.2.8 1.9 1.1L12 21h4l.4-2.6c.7-.3 1.3-.6 1.9-1.1l2.4.9 2-3.5-2-1.6Z" transform="translate(-2 0)"/></svg>
  </button>
  <div id="season" class="seasonbar"><i id="seasonFill"></i></div>
</header>
<div id="upd"></div>
<main id="view"></main>
<nav id="nav">
  <button data-tab="firma" class="on"><svg viewBox="0 0 24 24"><path d="M3 21V9l6-4v4l6-4v4l6-4v16H3Z"/></svg>Firma</button>
  <button data-tab="budowa"><svg viewBox="0 0 24 24"><path d="M2 20h20v2H2zM4 18V9h4v9zm6 0V4h4v14zm6 0v-6h4v6z"/></svg>Budowa</button>
  <button data-tab="magazyn"><svg viewBox="0 0 24 24"><path d="M12 2 2 7v15h20V7L12 2Zm-6 18v-8h12v8H6Zm2-6h8v2H8v-2Zm0 3h8v2H8v-2Z"/></svg>Rynek</button>
  <button data-tab="logistyka"><svg viewBox="0 0 24 24"><path d="M1 6h13v9H1V6Zm13 3h4l4 4v2h-8V9ZM5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm13 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>Transport</button>
  <button data-tab="ranking"><svg viewBox="0 0 24 24"><path d="M3 21v-8h5v8H3Zm6.5 0V4h5v17h-5ZM16 21v-11h5v11h-5Z"/></svg>Ranking</button>
</nav>
<div id="tut" class="tut" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="wiz" class="wiz" hidden></div>
<div id="toast" class="toast"></div>
<script src="version.js"></script>
<script src="lib/leaflet/leaflet.js"></script>
<script src="lib/d3-array.min.js"></script>
<script src="lib/d3-geo.min.js"></script>
<script src="maps.js"></script>
<script src="places.js"></script>
<script src="game.js"></script>
</body>
</html>
